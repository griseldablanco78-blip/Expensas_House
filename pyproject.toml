[project]
name = "expensa-house-api"
version = "2.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.18",
    "Pillow>=11",
    "argon2-cffi>=23.1,<26",
    "python-dotenv>=1,<2",
    "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

# Únicamente archivos públicos de frontend; fotos y credenciales quedan fuera.
[tool.vercel.fastapi.static]
cdn = true
